# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 1

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    # - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      # - aix
      # - android
      - darwin
      # - dragonfly
      - freebsd
      # - illumos
      # - ios
      # - js
      - linux
      - netbsd
      - openbsd
      # - plan9
      - solaris
      # - wasip1
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - loong64
      - mips
      - mips64
      - mips64le
      - mipsle
      - ppc64
      - ppc64le
      - riscv64
      - s390x
      # - wasm
    # goamd64:
    #   - v2
    #   - v3
    goarm:
      - 5
      - 6
      - 7
    # goarm64:
    #   - v8.0
    # gomips:
    #   - hardfloat
    #   - softfloat
    # go386:
    #   - sse2
    #   - softfloat
    # goppc64:
    #   - power8
    #   - power9
    # goriscv64:
    #   - rva22u64
    ignore:
      - goos: plan9
        goarch: 386
archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "^ci"
      - "^build"
      - "^style"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: "Dependency Updates"
      regexp: "^.*(feat|fix)\\(deps\\)*:+.*$"
      order: 300
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "Refactoring"
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 150
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "Documentation Updates"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: Other work
      order: 9999
